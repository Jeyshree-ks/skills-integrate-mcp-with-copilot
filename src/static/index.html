<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
      <div class="user-menu">
        <button id="user-menu-button" type="button" aria-label="Teacher account"
          aria-expanded="false" aria-controls="user-menu">&#128100;</button>
        <div id="user-menu" class="hidden">
          <p id="teacher-status">Student view</p>
          <button id="login-button" type="button">Teacher login</button>
          <button id="logout-button" class="hidden" type="button">Log out</button>
        </div>
      </div>
    </header>

    <dialog id="login-dialog" aria-labelledby="login-title">
      <form id="login-form">
        <h3 id="login-title">Teacher login</h3>
        <div class="form-group">
          <label for="username">Username:</label>
          <input id="username" autocomplete="username" required maxlength="100" />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input id="password" type="password" autocomplete="current-password" required maxlength="1024" />
        </div>
        <p id="login-error" class="error hidden" role="alert"></p>
        <button type="submit">Log in</button>
        <button id="cancel-login" type="button">Cancel</button>
      </form>
    </dialog>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <p id="login-notice">Only logged-in teachers can register or unregister students.</p>
        <form id="signup-form" class="hidden">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden" role="status"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
